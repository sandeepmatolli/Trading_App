name: Offline Python tests

on:
  push:
    branches: [dev2]
  pull_request:
    branches: [dev2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python compilation
        run: |
          python -m compileall -q ai fundamentals market_data news screening technical tests main.py batch_scan.py campaign_scan.py prefilter_scan.py research_digest.py config.py
      - name: Run offline regression suite
        run: python -m pytest -q